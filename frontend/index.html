
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoImpact AI | Professional Sustainability Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Outfit', sans-serif; 
        background-color: #ffffff;
        color: #064e3b;
        margin: 0;
      }
      .serif { font-family: 'Instrument Serif', serif; }
      .glass {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(16, 185, 129, 0.1);
      }
      .glow-emerald {
        box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1), 0 4px 6px -2px rgba(16, 185, 129, 0.05);
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #ffffff; }
      ::-webkit-scrollbar-thumb { background: #d1fae5; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #a7f3d0; }
      
      .bg-green-white-theme {
        background: radial-gradient(circle at 0% 0%, #f0fdf4 0%, transparent 50%),
                    radial-gradient(circle at 100% 100%, #f0fdf4 0%, transparent 50%),
                    #ffffff;
      }
    </style>
</head>
  <body class="bg-green-white-theme">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
